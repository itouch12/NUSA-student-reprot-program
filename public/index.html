<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Issue Tracker</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #fff;
        --text: #1d2330;
        --muted: #677084;
        --primary: #1f4fd8;
        --border: #dde1e9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        overscroll-behavior-y: none;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      header {
        background: #14233f;
        color: #fff;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      header h1 {
        font-size: 1.2rem;
        margin: 0;
      }
      #userbar {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 20px;
      }
      h2 {
        margin: 0 0 14px;
        font-size: 1.1rem;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 12px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 10px;
        margin-top: 4px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        background: #fff;
        color: inherit;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 9px 16px;
        background: var(--primary);
        color: #fff;
      }
      button.secondary {
        background: #e8ebf2;
        color: var(--text);
      }
      button.danger {
        background: #c93a3a;
      }
      button.small {
        padding: 5px 10px;
        font-size: 0.85rem;
      }
      button.link {
        background: none;
        color: var(--primary);
        padding: 0;
        text-decoration: underline;
      }
      #message {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-weight: 500;
      }
      #message.success {
        background: #e3f6e8;
        color: #14632b;
        border: 1px solid #a8dfb8;
      }
      #message.error {
        background: #fde8e8;
        color: #8f1d1d;
        border: 1px solid #f0b4b4;
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .chip {
        background: #eef1f8;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 0.9rem;
      }
      .chip strong {
        display: block;
        font-size: 1.3rem;
      }
      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr 2fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .filters select,
      .filters input {
        margin-top: 0;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        font-size: 0.92rem;
      }
      th {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .desc {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 2px;
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .badge.Open {
        background: #fde8e8;
        color: #8f1d1d;
      }

      .badge.InProgress {
        background: #fff3d6;
        color: #7a5300;
      }
      .badge.Resolved {
        background: #e3f6e8;
        color: #14632b;
      }
      td select {
        margin-top: 0;
        padding: 5px 6px;
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 24px 0;
      }
      @media (max-width: 600px) {
        .row,
        .filters {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Campus Issue Tracker</h1>
      <div id="userbar" hidden>
        <span id="whoami"></span>
        <button id="logoutBtn" class="secondary small">Log out</button>
      </div>
    </header>

    <main>
      <div id="message" role="status" hidden></div>

      <!-- LOGIN / REGISTER -->
      <section id="authSection" hidden>
        <h2 id="authTitle">Log in</h2>
        <form id="authForm">
          <label
            >Username
            <input
              id="username"
              required
              minlength="3"
              autocomplete="username"
            />
          </label>
          <label
            >Password
            <input
              id="password"
              type="password"
              required
              minlength="6"
              autocomplete="current-password"
            />
          </label>
          <button type="submit" id="authSubmit">Log in</button>
        </form>
        <p>
          <button class="link" id="toggleAuth" type="button">
            No account yet? Register
          </button>
        </p>
      </section>

      <!-- MAIN APP -->
      <div id="appSection" hidden>
        <section>
          <div class="summary" id="summary"></div>
        </section>

        <section>
          <h2 id="formTitle">Report an Issue</h2>
          <form id="issueForm">
            <label
              >Title
              <input
                id="title"
                required
                maxlength="120"
                placeholder="e.g. Broken light in library corridor"
              />
            </label>
            <div class="row">
              <label
                >Category
                <select id="category">
                  <option>Electrical</option>
                  <option>Plumbing</option>
                  <option>Furniture</option>
                  <option>Network</option>
                  <option>Other</option>
                </select>
              </label>
              <label
                >Location
                <input
                  id="location"
                  maxlength="120"
                  placeholder="e.g. Library, 1st floor"
                />
              </label>
            </div>
            <label
              >Description
              <textarea
                id="description"
                required
                placeholder="Describe the problem..."
              ></textarea>
            </label>
            <button type="submit" id="issueSubmit">Submit report</button>
            <button type="button" id="cancelEdit" class="secondary" hidden>
              Cancel
            </button>
          </form>
        </section>

        <section>
          <h2>All Reports</h2>
          <div class="filters">
            <select id="filterStatus">
              <option value="">All statuses</option>
              <option>Open</option>
              <option>In Progress</option>
              <option>Resolved</option>
            </select>
            <select id="filterCategory">
              <option value="">All categories</option>
              <option>Electrical</option>
              <option>Plumbing</option>
              <option>Furniture</option>
              <option>Network</option>
              <option>Other</option>
            </select>
            <input id="search" placeholder="Search by keyword..." />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Reported by</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="issueBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script>
      const STATUSES = ["Open", "In Progress", "Resolved"];
      let currentUser = null;
      let issues = [];
      let editingId = null;
      let registerMode = false;

      const $ = (id) => document.getElementById(id);

      // Escapes text so that anything a user types is shown as text, never run as code
      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function showMessage(text, type = "success") {
        const box = $("message");
        box.textContent = text;
        box.className = type;
        box.hidden = false;
        clearTimeout(showMessage.timer);
        showMessage.timer = setTimeout(() => {
          box.hidden = true;
        }, 5000);
      }

      // One helper for all requests to the backend
      async function api(path, method = "GET", body) {
        const options = { method, headers: {}, credentials: "same-origin" };
        if (body !== undefined) {
          options.headers["Content-Type"] = "application/json";
          options.body = JSON.stringify(body);
        }
        const res = await fetch(path, options);
        let data = {};
        try {
          data = await res.json();
        } catch (e) {}
        if (!res.ok) {
          if (res.status === 401 && currentUser) {
            // session expired
            currentUser = null;
            renderView();
          }
          throw new Error(
            data.error || "Something went wrong. Please try again.",
          );
        }
        return data;
      }

      function renderView() {
        const loggedIn = !!currentUser;
        $("authSection").hidden = loggedIn;
        $("appSection").hidden = !loggedIn;
        $("userbar").hidden = !loggedIn;
        if (loggedIn) {
          $("whoami").textContent = currentUser.username;
        }
      }

      async function loadIssues() {
        try {
          issues = await api("/issues");
          renderIssues();
        } catch (err) {
          showMessage(err.message, "error");
        }
      }

      function renderSummary() {
        const count = (s) => issues.filter((i) => i.status === s).length;
        $("summary").innerHTML =
          `<div class="chip"><strong>${issues.length}</strong>Total</div>` +
          `<div class="chip"><strong>${count("Open")}</strong>Open</div>` +
          `<div class="chip"><strong>${count("In Progress")}</strong>In Progress</div>` +
          `<div class="chip"><strong>${count("Resolved")}</strong>Resolved</div>`;
      }

      function renderIssues() {
        renderSummary();
        const status = $("filterStatus").value;
        const category = $("filterCategory").value;
        const term = $("search").value.trim().toLowerCase();

        const shown = issues.filter((i) => {
          if (status && i.status !== status) return false;
          if (category && i.category !== category) return false;
          if (term) {
            const text = [
              i.title,
              i.description,
              i.location,
              i.category,
              i.reporter_name,
            ]
              .join(" ")
              .toLowerCase();
            if (!text.includes(term)) return false;
          }
          return true;
        });

        const body = $("issueBody");
        if (shown.length === 0) {
          body.innerHTML = `<tr><td colspan="6" class="empty">No reports found.</td></tr>`;
          return;
        }

        const isStaff = true;
        body.innerHTML = shown
          .map((i) => {
            const canModify = isStaff || i.user_id === currentUser.id;
            const statusCell = isStaff
              ? `<select data-status="${i.id}">${STATUSES.map(
                  (s) =>
                    `<option ${s === i.status ? "selected" : ""}>${s}</option>`,
                ).join("")}</select>`
              : `<span class="badge ${esc(i.status.replace(" ", ""))}">${esc(i.status)}</span>`;
            const actions = canModify
              ? `<div class="actions">
             <button class="small secondary" data-action="edit" data-id="${i.id}">Edit</button>
             <button class="small danger" data-action="delete" data-id="${i.id}">Delete</button>
           </div>`
              : "";
            const date = new Date(i.created_at).toLocaleDateString();
            return `<tr>
        <td><strong>${esc(i.title)}</strong><div class="desc">${esc(i.description)}</div></td>
        <td>${esc(i.category)}</td>
        <td>${esc(i.location)}</td>
        <td>${statusCell}</td>
        <td>${esc(i.reporter_name)}<div class="desc">${esc(date)}</div></td>
        <td>${actions}</td>
      </tr>`;
          })
          .join("");
      }

      function resetForm() {
        editingId = null;
        $("issueForm").reset();
        $("formTitle").textContent = "Report an Issue";
        $("issueSubmit").textContent = "Submit report";
        $("cancelEdit").hidden = true;
      }

      // ---------- events ----------

      $("toggleAuth").addEventListener("click", () => {
        registerMode = !registerMode;
        $("authTitle").textContent = registerMode
          ? "Create an account"
          : "Log in";
        $("authSubmit").textContent = registerMode ? "Register" : "Log in";
        $("toggleAuth").textContent = registerMode
          ? "Already have an account? Log in"
          : "No account yet? Register";
      });

      $("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const data = await api(
            registerMode ? "/register" : "/login",
            "POST",
            {
              username: $("username").value,
              password: $("password").value,
            },
          );
          currentUser = data.user;
          $("authForm").reset();
          showMessage(data.message);
          renderView();
          await loadIssues();
        } catch (err) {
          showMessage(err.message, "error");
        }
      });

      $("logoutBtn").addEventListener("click", async () => {
        try {
          await api("/logout", "POST");
        } catch (err) {}
        currentUser = null;
        issues = [];
        resetForm();
        renderView();
        showMessage("You have been logged out.");
      });

      $("issueForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          title: $("title").value,
          category: $("category").value,
          location: $("location").value,
          description: $("description").value,
        };
        try {
          const data = editingId
            ? await api("/issues/" + editingId, "PUT", payload)
            : await api("/issues", "POST", payload);
          showMessage(data.message);
          resetForm();
          await loadIssues();
        } catch (err) {
          showMessage(err.message, "error");
        }
      });

      $("cancelEdit").addEventListener("click", resetForm);

      ["filterStatus", "filterCategory"].forEach((id) =>
        $(id).addEventListener("change", renderIssues),
      );
      $("search").addEventListener("input", renderIssues);

      // Edit and delete buttons (one listener for the whole table)
      $("issueBody").addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const id = Number(btn.dataset.id);

        if (btn.dataset.action === "edit") {
          const issue = issues.find((i) => i.id === id);
          if (!issue) return;
          editingId = id;
          $("title").value = issue.title;
          $("category").value = issue.category || "Other";
          $("location").value = issue.location || "";
          $("description").value = issue.description;
          $("formTitle").textContent = "Edit Report #" + id;
          $("issueSubmit").textContent = "Save changes";
          $("cancelEdit").hidden = false;
          $("formTitle").scrollIntoView({ behavior: "smooth" });
        }

        if (btn.dataset.action === "delete") {
          if (!confirm("Delete this report? This cannot be undone.")) return;
          try {
            const data = await api("/issues/" + id, "DELETE");
            showMessage(data.message);
            if (editingId === id) resetForm();
            await loadIssues();
          } catch (err) {
            showMessage(err.message, "error");
          }
        }
      });

      // Status dropdown (staff only)
      $("issueBody").addEventListener("change", async (e) => {
        const select = e.target.closest("select[data-status]");
        if (!select) return;
        try {
          const data = await api(
            "/issues/" + select.dataset.status + "/status",
            "PATCH",
            { status: select.value },
          );
          showMessage(data.message);
          await loadIssues();
        } catch (err) {
          showMessage(err.message, "error");
          await loadIssues(); // put the dropdown back to the real value
        }
      });

      // ---------- start ----------
      (async function init() {
        try {
          const data = await api("/me");
          currentUser = data.user;
        } catch (err) {
          currentUser = null;
        }
        renderView();
        if (currentUser) await loadIssues();
      })();
    </script>
  </body>
</html>
